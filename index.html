<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cigarettes After Sex</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Native Audio Engine -->
  <audio id="audioEngine" preload="metadata"></audio>

  <div class="player-container">

    <!-- Top Navigation -->
    <header class="top-nav">
      <button class="nav-icon-btn" id="muteBtn" aria-label="Toggle Mute">
        <svg id="muteIcon" width="18" height="18" viewBox="0 0 24 24">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
      </button>

      <div class="brand-header">
        <div class="brand-title">CIGARETTES AFTER SEX</div>
        <div class="brand-sub">33 ⅓ rpm • stereo</div>
      </div>

      <button class="nav-icon-btn" id="drawerTrigger" aria-label="Open Catalogue">
        <svg width="20" height="20" viewBox="0 0 24 24"><path d="M4 6h16v1.5H4zm0 5.5h16v1.5H4zm0 5.5h16v1.5H4z"/></svg>
      </button>
    </header>

    <!-- Track Details -->
    <section class="title-block">
      <h1 class="track-name" id="trackName">apocalypse</h1>
      <p class="track-release" id="trackRelease">cigarettes after sex — 2017</p>
    </section>

    <!-- Center Stage: Sleeve + Silky Smooth Slide-Out Vinyl Platter -->
    <main class="artwork-viewport">
      <div class="record-assembly" id="recordAssembly">

        <!-- Outer Platter Handles the Smooth Slide In & Out -->
        <div class="vinyl-platter" id="vinylPlatter">
          <!-- Inner Disc Handles Continuous 33 RPM Rotation -->
          <div class="vinyl-disc">
            <div class="vinyl-core">
              <span class="core-speed">33 RPM</span>
              <div class="spindle-hole"></div>
              <span class="core-tag">STEREO</span>
            </div>
          </div>
        </div>

        <!-- Square Matte Sleeve Jacket -->
        <div class="sleeve-jacket" id="sleeveJacket">
          <img src="assets/covers/cas2017.jpg" alt="Album Cover" id="coverArt" />

          <div class="sleeve-editorial-overlay">
            <div class="overlay-top">
              <span>LP — NOIR</span>
              <span id="sideIndicator">SIDE A — 04</span>
            </div>
            <div class="overlay-bottom">
              <!-- <span class="editorial-brand">cigarettes after sex</span> -->
              <span class="editorial-sub">EXCLUSIVE MONOCHROME EDITION</span>
            </div>
          </div>
        </div>

      </div>
    </main>

    <!-- Scrubber Timeline -->
    <section class="scrubber-section">
      <div class="progress-track" id="progressTrack">
        <div class="progress-fill" id="progressFill">
          <div class="progress-handle"></div>
        </div>
      </div>
      <div class="time-readout">
        <span id="currentTime">0:00</span>
        <span id="remainingTime">-0:00</span>
      </div>
    </section>

    <!-- Playback Controls -->
    <footer class="deck-controls">
      <button class="deck-btn" id="shuffleBtn" aria-label="Shuffle">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      </button>

      <button class="deck-btn" id="prevBtn" aria-label="Previous">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button class="deck-play" id="playBtn" aria-label="Play">
        <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <button class="deck-btn" id="nextBtn" aria-label="Next">
        <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>

      <button class="deck-btn" id="repeatBtn" aria-label="Repeat">
        <svg width="18" height="18" viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
      </button>
    </footer>

    <!-- Bottom Pill Trigger -->
    <div class="archive-pill" id="archiveTrigger">
      <div class="archive-dash"></div>
      <span class="archive-label">ARCHIVE LIST</span>
    </div>

    <!-- Catalogue Slide-Up Drawer -->
    <aside class="archive-sheet" id="archiveSheet">
      <div class="sheet-top">
        <span class="sheet-title">CATALOGUE</span>
        <button class="nav-icon-btn" id="closeArchiveBtn" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>

      <nav class="album-chips" id="albumChips"></nav>
      <div class="sheet-tracklist" id="sheetTracklist"></div>
    </aside>

    <div class="sheet-overlay" id="sheetOverlay"></div>

  </div>

  <script src="js/discography.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
